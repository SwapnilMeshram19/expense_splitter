plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.googlecredential'
version = '0.1.0'

android {
  namespace "expo.modules.googlecredential"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Google's current sign-in stack (replaces the deprecated GoogleSignInClient).
  implementation "androidx.credentials:credentials:1.6.0"
  implementation "androidx.credentials:credentials-play-services-auth:1.6.0"
  implementation "com.google.android.libraries.identity.googleid:googleid:1.1.1"
}