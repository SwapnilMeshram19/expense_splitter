name: Supabase keep-alive

# Free projects pause after ~7 days without activity. The project serves the Play Store app, so a
# pause means sign-in and sync stop for everyone. Twice a week is well inside that window.
on:
  schedule:
    - cron: '30 3 * * 1,4' # Mon & Thu 03:30 UTC (09:00 IST)
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          curl --fail --silent --show-error --max-time 30 --retry 2 --retry-delay 10 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
