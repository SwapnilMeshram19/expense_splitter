name: Supabase keep-alive

# Free projects pause after ~7 days without activity, and a paused production project means sign-in
# and sync stop for everyone. Twice a week is well inside that window.
on:
  schedule:
    - cron: '30 3 * * 1,4' # Mon & Thu 03:30 UTC (09:00 IST)
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    strategy:
      fail-fast: false # one project failing must not skip the other
      matrix:
        project: [dev, prod]
    steps:
      - name: Ping ${{ matrix.project }} database
        env:
          PROJECT: ${{ matrix.project }}
          # dev: the original secrets. prod: the same ones the release workflow uses.
          SUPABASE_URL: ${{ matrix.project == 'prod' && secrets.PROD_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ matrix.project == 'prod' && secrets.PROD_SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            if [ "$PROJECT" = prod ]; then
              echo "::notice::PROD_SUPABASE_URL / PROD_SUPABASE_PUBLISHABLE_KEY not set yet: skipping prod"
              exit 0
            fi
            echo "::error::SUPABASE_URL / SUPABASE_PUBLISHABLE_KEY secrets are not set"
            exit 1
          fi
          curl --fail --silent --show-error --max-time 30 --retry 2 --retry-delay 10 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
