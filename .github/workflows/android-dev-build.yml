name: Android dev build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - app.json
      - modules/**
      - .github/workflows/android-dev-build.yml

concurrency:
  group: android-dev-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project (CNG)
        run: npx expo prebuild --platform android --no-install --clean

      - name: Install dev keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEV_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_DEV_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          # Same alias/passwords as RN's template, so the generated signingConfig works as-is.
          echo "$KEYSTORE_B64" | base64 -d > android/app/debug.keystore

      - name: Build debug APK (dev client)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Print signing certificate (must match Google Cloud's Android client)
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk \
            | grep -E 'SHA-1|SHA-256'

      - uses: actions/upload-artifact@v4
        with:
          name: expense-splitter-dev-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14