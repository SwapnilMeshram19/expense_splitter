name: CI

# One job per push to main: typecheck, lint, tests and the domain-copy check (was a separate
# workflow). Feature branches aren't pushed any more, so nothing runs twice.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - name: Domain copy in sync
        run: |
          node scripts/sync-domain.mjs
          if [ -n "$(git status --porcelain -- supabase/functions/_shared/domain)" ]; then
            git status --porcelain -- supabase/functions/_shared/domain
            echo "::error::src/domain changed without re-running 'npm run domain:sync'. Run it and commit."
            exit 1
          fi
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci
      # The web app: same shared code, its own dependencies (typecheck + production build).
      - run: npm ci --prefix web --no-audit --no-fund
      - run: npm --prefix web run check
